name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-xlib python3-pytest ffmpeg libglib2.0-bin \
            xvfb dbus x11-apps x11-utils xdotool xclip
      - name: Lint
        run: pipx run ruff==0.17.3 check src tests
      - name: Unit tests
        run: python3 -m pytest -q
      - name: End-to-end tests on a virtual display
        run: python3 -m pytest -q -m e2e tests/e2e

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the package
        run: packaging/build-deb.sh
      - name: Install it the way a user would
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/jiffy_*_all.deb
          jiffy --version
          python3 -c "import jiffy.app, jiffy.selector, jiffy.session"
      - uses: actions/upload-artifact@v7
        with:
          name: jiffy-deb
          path: dist/*.deb
